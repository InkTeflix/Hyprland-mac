# --- DATE LABEL ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a %b %d")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = SF Pro Display, Helvetica Neue, Sans
    position = 0, 240
    halign = center
    valign = center
}

# --- TIME LABEL (Large macOS Look) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 80
    font_family = SF Pro Display, Helvetica Neue, Sans
    # font_weight = Medium
    position = 0, 150
    halign = center
    valign = center
}

# --- USER PROFILE IMAGE ---
image {
    monitor =
    path = $HOME/.face.icon  # Put your square profile pic here
    size = 75                        # Controls the circular dimensions
    border_size = 1
    border_color = rgba(255, 255, 255, 0.4)
    position = 0, -180
    halign = center
    valign = center
}

# --- USERNAME LABEL ---
label {
    monitor =
    text = Your Name
    color = rgba(255, 255, 255, 0.9)
    font_size = 13
    font_family = SF Pro Text, Sans
    # font_weight = bold
    position = 0, -240
    halign = center
    valign = center
}

# --- PASSWORD INPUT FIELD ---
input-field {
    monitor =
    size = 200, 36
    outline_thickness = 1
    dots_size = 0.25 
    dots_spacing = 0.3 
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.35)   # Slightly darkened glass fill
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffae">Enter Password</span>
    hide_input = false
    position = 0, -280
    halign = center
    valign = center
}

background {
    monitor =
    # Always pull the active wallpaper from the cache file
    path = $HOME/.cache/ml4w/blurred_wallpaper.png 
    
    # Optional: Match the premium macOS look by adding subtle softness
    blur_passes = 0            # Set to 0 if you want it crisp like the image
    blur_size = 0
    noise = 0.01
}
